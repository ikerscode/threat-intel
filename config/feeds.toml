# seclab threat-intel feed configuration.
#
# enabled          collect this feed in `collect all` and in the scheduler
# interval_min     scheduler interval in minutes
# min_refetch_s    if the cached copy is younger than this, reuse it and do not hit the server
# timeout_s        HTTP timeout for this feed
#
# API keys are never stored here. They are read from environment variables:
#   NVD_API_KEY       optional, raises the NVD rate limit
#   ABUSECH_AUTH_KEY  required by URLhaus and ThreatFox since their public exports were retired
#   OTX_API_KEY       required by the optional AlienVault OTX feed
#
# limit            cap on rows kept per run (large lists use a stable hash sample)
# retention_days   rotating lists only: drop entries not seen on the list for this long
#
# The HUD can switch a feed on or off at runtime. That override is kept in the
# database (feed_state table) so this file stays the clean default.

[general]
user_agent = "seclab-ti/0.1"
cache_dir = "data/cache"
db_path = "data/threatintel.db"
reports_dir = "data/reports"
# minimum seconds between two requests to the same host
default_host_interval_s = 1.5

[scheduler]
enabled = false          # can be switched on from the Feeds tab
tick_s = 60              # how often the scheduler checks for due feeds
correlate_after = true   # re-run correlation after any successful collection

[feeds.kev]
enabled = true
interval_min = 360
min_refetch_s = 1800
timeout_s = 60

[feeds.epss]
enabled = true
interval_min = 1440
min_refetch_s = 3600
timeout_s = 60
batch_size = 100

[feeds.nvd]
enabled = false          # slow: about 4 large paged requests with 6.5 s gaps, run it on demand
interval_min = 10080
min_refetch_s = 86400
timeout_s = 120
page_size = 500

[feeds.attack]
enabled = true
interval_min = 10080
min_refetch_s = 86400
timeout_s = 180

[feeds.feodo]
enabled = true
interval_min = 60
min_refetch_s = 600
timeout_s = 30

[feeds.urlhaus]
enabled = true           # skipped cleanly unless ABUSECH_AUTH_KEY is set
interval_min = 60
min_refetch_s = 600
timeout_s = 60
limit = 500

[feeds.threatfox]
enabled = true           # skipped cleanly unless ABUSECH_AUTH_KEY is set
interval_min = 60
min_refetch_s = 600
timeout_s = 60
days = 3

[feeds.openphish]
enabled = true
interval_min = 360
min_refetch_s = 1800
timeout_s = 30

[feeds.ransomware]
enabled = true
interval_min = 360
min_refetch_s = 1800
timeout_s = 60
# ransomware.live answers "1 per 1 minute" when called faster than this
host_interval_s = 62

[feeds.spamhaus]
enabled = true
interval_min = 1440
min_refetch_s = 3600
timeout_s = 30

[feeds.tor]
enabled = true
interval_min = 360
min_refetch_s = 1800
timeout_s = 30

[feeds.ip2asn]
enabled = false          # 11 MB download, run `python -m threatintel collect ip2asn` when wanted
interval_min = 43200
min_refetch_s = 604800
timeout_s = 300

[feeds.sslbl]
enabled = true
interval_min = 360
min_refetch_s = 1800
timeout_s = 60
limit = 1500             # newest certificate listings kept (the file has ~11k back to 2014)

[feeds.et_compromised]
enabled = true
interval_min = 720
min_refetch_s = 3600
timeout_s = 30
limit = 2000
retention_days = 14

[feeds.cins]
enabled = true
interval_min = 720
min_refetch_s = 3600
timeout_s = 60
limit = 5000             # ~15k listed; stable hash sample
retention_days = 14

[feeds.blocklistde]
enabled = true
interval_min = 720
min_refetch_s = 3600
timeout_s = 60
list = "ssh"             # "ssh" (~5k, matches the SSH honeypot) or "all" (~23k)
limit = 5000
retention_days = 14

[feeds.phishing_army]
enabled = true
interval_min = 720
min_refetch_s = 14400    # the list says "Expires: 4 hours"
timeout_s = 60
limit = 4000             # ~145k listed; stable hash sample
retention_days = 21

[feeds.circl]
enabled = true
interval_min = 1440
min_refetch_s = 21600
timeout_s = 90
events = 10              # most recently updated events
event_max_bytes = 2500000
attr_limit = 300         # to_ids attributes kept per event

[feeds.otx]
enabled = true           # skipped cleanly unless OTX_API_KEY is set
interval_min = 360
min_refetch_s = 1800
timeout_s = 60
days = 3
pulses = 20
ioc_limit = 200

[rdap]
# On-demand registration lookups. Only RDAP registry servers listed in the IANA
# bootstrap files (and rdap.org as a fallback redirector) are contacted, never
# the domain or IP being looked up.
ttl_days = 7
host_interval_s = 2.0
timeout_s = 15
max_per_request = 8
