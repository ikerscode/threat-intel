# Curated brand list for phishing impersonation analysis (threatintel/phishing.py).
#
# terms    brand names as they would appear in a hostname: lower case, letters and
#          digits only. Terms of 6+ characters are also matched by edit distance
#          (paypai, rnicrosoft, g00gle); shorter ones only exactly or after
#          homoglyph / character-swap folding, because short words collide with
#          ordinary words (ups, att, chase).
# domains  registered domains the brand really owns. A URL on one of these is not
#          counted as impersonation of that brand.
#
# Keys are the labels used in tags (brand:<key>) and in the HUD. Keep them stable.

[brands.microsoft]
terms = ["microsoft", "office365", "outlook", "onedrive", "sharepoint", "hotmail", "microsoftonline"]
domains = ["microsoft.com", "office.com", "live.com", "outlook.com", "sharepoint.com", "microsoftonline.com", "office365.com", "hotmail.com", "azure.com", "onedrive.com", "windows.net"]

