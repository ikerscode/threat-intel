# Curated alias map used by the correlation engine.
#
# Keys are canonical names, values are other spellings that refer to the same
# thing. Everything is passed through aliases.norm() before comparison, so case,
# spaces, dots, dashes and suffixes such as "ransomware", "group" or "team" do
# not matter. Only add an entry when public reporting clearly treats the names as
# the same operation; related-but-different crews (for example TA505 and the Clop
# ransomware) are linked through the software graph instead of merged here.

